# SmartPoultry PWA — static bundle plus a same-origin path to the API.
#
# Serving the app and proxying /api from one origin is what lets the frontend
# use relative "/api/..." URLs: no CORS preflight, no base URL baked into the
# bundle, and the JWT travels on requests that the browser considers first
# party.

upstream smartpoultry_api {
    # Compose service name. Docker's embedded DNS resolves it on the shared
    # network; nothing here is reachable from the host.
    server backend:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Report PDFs can be several MB, and product images are uploaded through
    # this proxy. The default 1m would reject them.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/manifest+json image/svg+xml;

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://smartpoultry_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Report generation narrates each section through the LLM and can take
        # well over a minute. The 60s default would cut it off mid-document.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Generated report PDFs and uploaded product images.
    location /uploads/ {
        proxy_pass       http://smartpoultry_api;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Socket.IO ──────────────────────────────────────────────────────────
    # Needs its own block: the Upgrade/Connection headers below are what turn
    # the HTTP request into a WebSocket. Without them Socket.IO silently falls
    # back to long-polling, and live delivery tracking crawls.
    location /socket.io/ {
        proxy_pass         http://smartpoultry_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # A tracking socket is idle between position updates; the 60s default
        # would tear it down and force a reconnect every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Service worker & manifest ──────────────────────────────────────────
    # These must never be cached. A cached service worker pins users to an old
    # build forever - the new bundle deploys and nobody ever receives it.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        expires -1;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Vite fingerprints everything under /assets/, so those filenames change
    # whenever their contents do and can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────
    # React Router owns the URL space: a hard refresh on /customer/orders has
    # to return index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
