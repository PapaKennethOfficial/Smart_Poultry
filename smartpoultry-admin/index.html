<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartPoultry</title>
    <meta name="theme-color" content="#237227" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <div id="error-log" style="color: red; padding: 20px; font-family: monospace; white-space: pre-wrap; position: absolute; z-index: 9999; top: 0; left: 0; background: white; width: 100%; min-height: 100vh; display: none;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var el = document.getElementById("error-log");
        el.style.display = "block";
        el.innerText += "Error: " + msg + "\nAt: " + url + ":" + line + ":" + col + "\nStack: " + (error ? error.stack : "") + "\n\n";
      };
      window.onunhandledrejection = function(event) {
        var el = document.getElementById("error-log");
        el.style.display = "block";
        el.innerText += "Unhandled Promise Rejection: " + event.reason + "\n\n";
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
